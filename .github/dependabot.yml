# Las acciones van fijadas por SHA (no por etiqueta, que se puede mover). Dependabot abre
# un PR cuando sale una versión nueva, para no quedarse con versiones viejas.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Espera 7 días desde que sale una versión antes de proponerla: si una acción publicada
    # es maliciosa (cuenta robada), para entonces suele estar detectada y retirada.
    cooldown:
      default-days: 7
    groups:
      acciones:
        patterns: ["*"]
