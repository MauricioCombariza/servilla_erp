<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sansation:wght@400;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AgriVision · ERP</title>
    <script>
      // Si la app no arranca (p. ej. un celular viejo), mostrar el error en vez de una pantalla en blanco.
      (function () {
        function mostrar(msg) {
          var root = document.getElementById("root");
          if (!root || root.childNodes.length) return;
          root.innerHTML =
            '<div style="font-family:sans-serif;padding:16px;color:#991b1b">' +
            "<p><b>La aplicación no pudo abrir en este navegador.</b></p>" +
            '<p style="font-size:13px;word-break:break-word"></p>' +
            '<p style="font-size:13px;color:#555">' + navigator.userAgent + "</p></div>";
          root.firstChild.childNodes[1].textContent = String(msg);
        }
        window.addEventListener("error", function (e) { mostrar(e.message || e); });
        window.addEventListener("unhandledrejection", function (e) { mostrar(e.reason); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
