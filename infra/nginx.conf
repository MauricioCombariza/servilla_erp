server {
    listen 80;
    server_name _;

    # Host fijo hacia los servicios: el que manda el cliente puede ser cualquiera (Semgrep
    # request-host-used). Ni FastAPI ni flujo lo usan hoy, pero así nunca se podrá armar un
    # enlace o una redirección con un dominio ajeno.
    set $host_publico erp.servilla.com.co;

    # IP real del cliente: llega por Caddy (en el host), que entra por la red de Docker.
    # Caddy (v2.5+) descarta el X-Forwarded-For que mande el cliente y pone el suyo, así
    # que $remote_addr y X-Real-IP quedan con la IP de quien se conecta (bloqueo y eventos
    # de seguridad del backend, y los logs de nginx).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Debe quedar por ENCIMA de MAX_UPLOAD_BYTES (150 MB) en
    # backend/app/routers/ordenes.py: si nginx corta primero, el cliente recibe
    # el 413 en HTML plano y el frontend no puede leer el campo `detail`, así que
    # muestra un error genérico en vez del mensaje que dice qué hacer.
    client_max_body_size 500M;

    # ── API de escaneo de tulas / asignación → servicio Go (flujo/) ──────────────
    # Mismas rutas y mismo JSON que tenía FastAPI, más las de trabajo sin señal
    # (/api/flujo/sync, /api/flujo/cambios, /api/paquetes-despacho/base) que usa el
    # frontend desde la migración a Go. Para volver a FastAPI: borrar este bloque Y
    # desplegar el frontend anterior (los routers de Python siguen ahí).
    # Todos los servicios van por resolver + variable: nginx vuelve a preguntar la IP al DNS
    # de Docker cada 10 s. Con `upstream` la resolvía una sola vez al arrancar, y al recrear
    # el backend (deploy o `up -d`) cambiaba de IP y toda la API daba 502 hasta recargar
    # nginx (pasó el 2026-11-23). También arranca aunque algún servicio no esté.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $flujo    http://flujo:8090;
    set $backend  http://backend:8000;
    set $frontend http://frontend:80;

    location ~ ^/api/(tulas|asignacion-zonas|asignacion-qr|imile-sesion|flujo)(/|$) {
        proxy_pass         $flujo;
        proxy_set_header   Host              $host_publico;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        # Abrir/cerrar una tula puede esperar la consulta a iMile (máx. ~10 s)
        proxy_read_timeout 30s;
    }
    location ~ ^/api/paquetes-despacho/(destino/|base$) {
        proxy_pass         $flujo;
        proxy_set_header   Host              $host_publico;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_read_timeout 30s;
    }

    # API → FastAPI
    # 600s porque la carga masiva de órdenes procesa el CSV dentro del request.
    location /api/ {
        proxy_pass         $backend;   # con variable pasa la URI tal cual (/api/...)
        proxy_set_header   Host              $host_publico;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Health check directo al backend
    location /health {
        proxy_pass $backend;
    }

    # Frontend SPA
    location / {
        proxy_pass         $frontend;
        proxy_set_header   Host              $host_publico;
        proxy_set_header   X-Real-IP         $remote_addr;
    }
}
