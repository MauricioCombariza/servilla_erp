upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Debe quedar por ENCIMA de MAX_UPLOAD_BYTES (150 MB) en
    # backend/app/routers/ordenes.py: si nginx corta primero, el cliente recibe
    # el 413 en HTML plano y el frontend no puede leer el campo `detail`, así que
    # muestra un error genérico en vez del mensaje que dice qué hacer.
    client_max_body_size 500M;

    # ── API de escaneo de tulas / asignación → servicio Go (flujo/) ──────────────
    # Mismas rutas y mismo JSON que tenía FastAPI, más las de trabajo sin señal
    # (/api/flujo/sync, /api/flujo/cambios, /api/paquetes-despacho/base) que usa el
    # frontend desde la migración a Go. Para volver a FastAPI: borrar este bloque Y
    # desplegar el frontend anterior (los routers de Python siguen ahí).
    # Con resolver + variable nginx arranca aunque flujo no esté: solo estas rutas dan 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $flujo http://flujo:8090;

    location ~ ^/api/(tulas|asignacion-zonas|asignacion-qr|imile-sesion|flujo)(/|$) {
        proxy_pass         $flujo;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        # Abrir/cerrar una tula puede esperar la consulta a iMile (máx. ~10 s)
        proxy_read_timeout 30s;
    }
    location ~ ^/api/paquetes-despacho/(destino/|base$) {
        proxy_pass         $flujo;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $request_id;
        proxy_read_timeout 30s;
    }

    # API → FastAPI
    # 600s porque la carga masiva de órdenes procesa el CSV dentro del request.
    location /api/ {
        proxy_pass         http://backend/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Health check directo al backend
    location /health {
        proxy_pass http://backend/health;
    }

    # Frontend SPA
    location / {
        proxy_pass         http://frontend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }
}
