# Las imágenes de backend, flujo y frontend las construye GitHub Actions y las sube a GHCR
# (.github/workflows/deploy.yml); infra/deploy.sh las descarga con IMAGEN_TAG = commit.
# `build:` queda solo para compilar a mano (docker compose build <servicio>) si GHCR falla.
services:

  postgres:
    image: postgres:16
    container_name: servilla_pg
    environment:
      POSTGRES_DB:       servilla_erp
      POSTGRES_USER:     servilla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${PG_PORT:-5440}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servilla -d servilla_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/mauriciocombariza/servilla-backend:${IMAGEN_TAG:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: servilla_backend
    environment:
      DATABASE_URL:     postgresql+asyncpg://servilla:${POSTGRES_PASSWORD}@postgres:5432/servilla_erp
      BASES_WEB_URL:    ${BASES_WEB_URL:-}
      JWT_SECRET:       ${JWT_SECRET}
      ALLOWED_ORIGINS:  ${ALLOWED_ORIGINS:-http://localhost}
      ENVIRONMENT:      ${ENVIRONMENT:-production}
      IMILE_USER:       ${IMILE_USER:-}
      IMILE_PASS:       ${IMILE_PASS:-}
      # Paso 2.5: ingreso de cada paquete leído en iMile (arrivalScanAWB). Apagado si falta
      IMILE_INGRESO_ACTIVO: ${IMILE_INGRESO_ACTIVO:-false}
      # Paso 2.3: al leer la tula, consulta en iMile (solo lectura) cuántos paquetes trae
      IMILE_CONSULTA_TULA_ACTIVA: ${IMILE_CONSULTA_TULA_ACTIVA:-true}
      # Una sola vez: la primera tula leída se descarga en iMile y se graba la respuesta
      IMILE_GRABAR_DESCARGA: ${IMILE_GRABAR_DESCARGA:-false}
    volumes:
      # Sesión de iMile (app/services/imile_sesion.py): sobrevive a reinicios del
      # contenedor, así no hay que volver a iniciar sesión (~30 s) cada vez
      - imile_secrets:/app/.secrets
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # No expone puerto al exterior — sólo accesible desde nginx

  # Servicio Go (flujo/): escaneo de tulas, asignación de zonas y la sesión de iMile.
  # nginx le manda solo esas rutas; el resto sigue en FastAPI. Usa la misma base y el
  # mismo JWT_SECRET. Espera a que el backend aplique la migración 049 antes de atender.
  flujo:
    image: ghcr.io/mauriciocombariza/servilla-flujo:${IMAGEN_TAG:-latest}
    build:
      context: ../flujo
      dockerfile: Dockerfile
    container_name: servilla_flujo
    environment:
      DATABASE_URL:     postgresql://servilla:${POSTGRES_PASSWORD}@postgres:5432/servilla_erp
      JWT_SECRET:       ${JWT_SECRET}
      IMILE_USER:       ${IMILE_USER:-}
      IMILE_PASS:       ${IMILE_PASS:-}
      IMILE_INGRESO_ACTIVO: ${IMILE_INGRESO_ACTIVO:-false}
      IMILE_CONSULTA_TULA_ACTIVA: ${IMILE_CONSULTA_TULA_ACTIVA:-true}
      IMILE_ASIGNACION_ACTIVA: ${IMILE_ASIGNACION_ACTIVA:-true}
      # Páginas de iMile trabajando a la vez (Llegada / Asignar repartidor)
      IMILE_POOL_INGRESO: ${IMILE_POOL_INGRESO:-2}
      IMILE_POOL_ASIGNAR: ${IMILE_POOL_ASIGNAR:-1}
    volumes:
      # La misma sesión de iMile guardada que usaba el backend (imile_sesion.json)
      - imile_secrets:/app/.secrets
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Al apagar, termina la página de iMile que esté en curso (cada tarea toma < 90 s)
    stop_grace_period: 90s
    restart: unless-stopped

  frontend:
    image: ghcr.io/mauriciocombariza/servilla-frontend:${IMAGEN_TAG:-latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: servilla_frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: servilla_nginx
    ports:
      - "8080:80"       # Caddy hace el TLS y proxea a este puerto
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - flujo
      - frontend
    restart: unless-stopped

volumes:
  pg_data:
  imile_secrets:
